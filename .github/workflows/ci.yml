name: Pipeline CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compiler
        run: mvn -B clean compile

      - name: Tests unitaires
        run: mvn -B test -DskipTests=false -Dmaven.test.skip=false

      - name: Afficher les résultats
        if: always()
        run: |
          if [ -f target/surefire-reports/com.exemple.CalculatorTest.txt ]; then
            cat target/surefire-reports/com.exemple.CalculatorTest.txt
          else
            echo "Aucun rapport trouvé"
          fi

      - name: Notifier échec
        if: failure()
        run: echo "TESTS ÉCHOUÉS - Veuillez corriger les erreurs"